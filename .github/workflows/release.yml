name: Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  workflow_dispatch:

# 必须赋予 actions 写权限，才能删除历史记录
permissions:
  actions: write
  contents: write

# 并发控制：如果再次触发，自动秒杀上一个正在运行的任务
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ==========================================
      # 第一步：暴力清理历史记录（在 checkout 之前）
      # ==========================================
      - name: Purge all old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "⏳ 正在清理所有历史工作流记录..."
          # 获取该仓库中所有运行记录的 ID
          RUNS=$(gh run list -R ${{ github.repository }} --limit 100 --json databaseId --jq '.[].databaseId')
          for id in $RUNS; do
            # 绝对不能删除当前正在运行的这个任务
            if [ "$id" == "${{ github.run_id }}" ]; then
              continue
            fi
            echo "🗑️ 正在强制删除历史记录: $id"
            # 先尝试取消（防止还在运行），再尝试删除，忽略可能产生的报错
            gh api -X POST /repos/${{ github.repository }}/actions/runs/$id/cancel || true
            gh api -X DELETE /repos/${{ github.repository }}/actions/runs/$id || true
          done
          echo "✅ 历史记录清理完毕。"

      # ==========================================
      # 下面是标准的构建与发布流程
      # ==========================================
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.jks
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      - name: Build and Sign Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Rename APK to Project Name
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/deepseek-r.apk || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-r
          path: app/build/outputs/apk/release/deepseek-r.apk
          retention-days: 1

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
          files: app/build/outputs/apk/release/deepseek-r.apk
          overwrite: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
