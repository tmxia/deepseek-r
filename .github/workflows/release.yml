name: Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Purge all old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "⏳ 正在清理所有历史工作流记录..."
          RUNS=$(gh run list -R ${{ github.repository }} --limit 100 --json databaseId --jq '.[].databaseId')
          for id in $RUNS; do
            if [ "$id" == "${{ github.run_id }}" ]; then continue; fi
            gh api -X POST /repos/${{ github.repository }}/actions/runs/$id/cancel || true
            gh api -X DELETE /repos/${{ github.repository }}/actions/runs/$id || true
          done
          echo "✅ 历史记录清理完毕。"

      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 自动提取版本号：如果是推 Tag，直接用 Tag；如果是推 main，从 build.gradle.kts 读取
      - name: Extract Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            VERSION_NAME=$(grep -E 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
            if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.0.0"; fi
            echo "VERSION=v${VERSION_NAME}" >> $GITHUB_ENV
          fi
          echo "准备发布的版本标签为: $VERSION"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.jks
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      - name: Build and Sign Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      # 健壮的 APK 查找与重命名：不依赖固定文件名，用 find 抓取
      - name: Prepare APK Artifact
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ 没有找到 APK 文件！"
            exit 1
          fi
          echo "找到 APK: $APK_PATH"
          cp "$APK_PATH" app/build/outputs/apk/release/deepseek-r.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-r
          path: app/build/outputs/apk/release/deepseek-r.apk
          retention-days: 1

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          files: app/build/outputs/apk/release/deepseek-r.apk
          overwrite_files: true
          prerelease: false
